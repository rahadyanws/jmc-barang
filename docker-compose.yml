services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jmc
      POSTGRES_PASSWORD: jmc
      POSTGRES_DB: jmc_barang
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jmc -d jmc_barang"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
